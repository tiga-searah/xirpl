name: xirpl

networks:
  public_net:
    external: true
  internal:

services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - ./data/postgresql:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    configs:
      - source: init-db
        target: /docker-entrypoint-initdb.d/init.sql
      
  s3:
    image: pgsty/silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: $S3_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: $S3_SECRET_ACCESS_KEY
    volumes:
      - ./data/minio:/data
    networks:
      - public_net
      - internal
    healthcheck:
      test: ["CMD-SHELL", "silo healthcheck ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: aryareal/api-xirpl
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET
      JWT_SECRET: $JWT_SECRET
      HASH_SECRET: $HASH_SECRET
      IOT_ACCESS_KEY: $IOT_ACCESS_KEY
      WEB_URL: $WEB_URL
      API_URL: $API_URL
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY_ID: $S3_ACCESS_KEY_ID
      S3_SECRET_ACCESS_KEY: $S3_SECRET_ACCESS_KEY
      S3_BUCKET: $S3_BUCKET
      VAPID_PUBLIC_KEY: $VAPID_PUBLIC_KEY
      VAPID_PRIVATE_KEY: $VAPID_PRIVATE_KEY
      VAPID_SUBJECT: $VAPID_SUBJECT
    networks:
      - public_net
      - internal
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    image: aryareal/web-xirpl
    restart: unless-stopped
    pull_policy: always
    environment:
      NEXT_PUBLIC_API_URL: $API_URL
    networks:
      - public_net
    depends_on:
      - api

  admin:
    image: aryareal/admin-xirpl
    restart: unless-stopped
    pull_policy: always
    environment:
      NEXT_PUBLIC_API_URL: $API_URL
    networks:
      - public_net
    depends_on:
      - api

  umami:
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: $UMAMI_SECRET
    networks:
      - public_net
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

configs:
  init-db:
    content: |
      CREATE DATABASE umami;